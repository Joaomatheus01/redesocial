
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conecta | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topo">
        <h1>Conecta<span>.</span></h1>
        <p>Que bom ter você de volta!</p>
    </header>

    <main class="login-container">

        <div class="login-icon">✦</div>

        <h2>Bem-vindo de volta!</h2>

        <p class="subtitulo">
            Entre na sua conta para continuar conectado.
        </p>

        <form id="formLogin">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">Entrar na conta →</button>

        </form>

        <p id="mensagem"></p>

        <div class="login-links">
            <p>Não possui uma conta?</p>
            <a href="cadastro.html">Criar minha conta</a>

            <a href="index.html" class="voltar">← Voltar ao início</a>
        </div>

    </main>

    <footer>
        © 2026 Conecta. Feito para compartilhar momentos.
    </footer>

</body>
</html>
