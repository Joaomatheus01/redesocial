
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conecta | Cadastro</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Conecta</h1>
        <p>Faça parte da nossa comunidade!</p>
    </header>

    <main>

        <h2>Criar conta</h2>

        <form id="formCadastro">

            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                placeholder="Escolha seu usuário"
                required
            >

            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha:</label>
            <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                required
            >

            <button type="submit">Cadastrar</button>

        </form>

        <p id="mensagem"></p>

        <p>Já possui uma conta?</p>

        <a href="login.html">Fazer login</a>

        <p>
            <a href="index.html">Voltar ao início</a>
        </p>

    </main>

    <script>

        const formulario = document.getElementById("formCadastro");

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            const mensagem = document.getElementById("mensagem");

            try {

                const resposta = await fetch("../back/api.php?rota=usuario", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        nome: nome,
                        username: username,
                        email: email,
                        senha: senha
                    })

                });

                const dados = await resposta.json();

                if (resposta.ok) {

                    mensagem.textContent = "Cadastro realizado com sucesso!";

                    mensagem.style.color = "green";

                    formulario.reset();

                } else {

                    mensagem.textContent = dados.erro || "Não foi possível realizar o cadastro.";

                    mensagem.style.color = "red";

                }

            } catch (erro) {

                mensagem.textContent = "Erro ao conectar com o servidor PHP.";

                mensagem.style.color = "red";

            }

        });

    </script>

</body>

</html>
